<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{%block title%}CodeFit{%endblock%}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body class="auth">
    <div class="orb"></div>
    <div class="auth-shell">
        {% if request.endpoint != 'login' %}
        <a class="brand center" href="{{url_for('login')}}">
            <b>C</b>
            <span>Code<span>Fit</span> <small>IA</small></span>
        </a>
        {% endif %}
        <p class="tagline">El código exacto para tu bienestar</p>
        {% with ms=get_flashed_messages(with_categories=true) %}
            {% for c,m in ms %}
                <div class="flash {{c}}">{{m}}</div>
            {% endfor %}
        {% endwith %}
        {%block content%}{%endblock%}
    </div>
</body>
</html>
